# 이 파일을 application-secret.yml 로 복사해서 값을 채운다.
#
#   cp application-secret-example.yml application-secret.yml
#
# 위치는 이 레포 루트다. application.yml 이 아래 세 곳을 순서대로 찾는다.
#   classpath:application-secret.yml
#   ./application-secret.yml          ← 분리된 레포에서는 여기
#   ../application-secret.yml         ← backend 모노레포에 있을 때
#
# .gitignore 에 걸려 있어 커밋되지 않는다.
# backend 레포에도 같은 이름의 파일이 있는데, 그쪽은 6개 서비스 키를 전부 담는다.
# 여기는 crew 가 실제로 읽는 키만 남겼다.

# ---------------------------------------------------------------------------
# DB
#
# crew 는 자기 스키마(crew_svc)를 소유한 전용 계정으로만 접속한다.
# 남의 스키마를 읽는 쿼리는 permission denied 로 즉시 실패한다 — 그게 정상이다.
# 계정과 스키마는 ./db/init.sh 가 만든다.
# ---------------------------------------------------------------------------
DB_URL: jdbc:postgresql://localhost:5432/duo

CREW_DB_USERNAME: duo_crew
CREW_DB_PASSWORD: local-crew-pw

# 관리용. 앱은 쓰지 않고 ./db/init.sh 가 계정을 만들 때만 쓴다.
# postgres 가 Docker 안에 있으면 컨테이너 안에서 유닉스 소켓으로 접속하므로
# DB_PASSWORD 가 틀려도 동작한다.
DB_USERNAME: duo
DB_PASSWORD: change-me-local-db-password

# ---------------------------------------------------------------------------
# RabbitMQ — 한 브로커를 두 용도로 쓴다
#   AMQP  :5672    서비스 간 이벤트 (crew -> user 알림 요청 등)
#   STOMP :61613   House 채팅 릴레이 (브라우저 <-> crew)
#
# ⚠️ STOMP 는 공식 rabbitmq 이미지에 없는 플러그인이다.
#    infra 레포의 rabbitmq/Dockerfile 이 켜준 커스텀 이미지를 써야 한다.
#    안 켜져 있어도 앱은 뜨지만 채팅만 동작하지 않는다.
# ---------------------------------------------------------------------------
RABBITMQ_USERNAME: appuser
RABBITMQ_PASSWORD: apppass

# ---------------------------------------------------------------------------
# JWT — user 서비스가 발급한 토큰을 crew 가 검증한다.
#
# ⚠️ 반드시 user/post/chat/match/riot 과 같은 값이어야 한다. 다르면 로그인은 되는데
#    crew API 만 401 이 난다.
# ⚠️ 32바이트 이상이어야 한다. 짧으면 부팅 때 WeakKeyException 으로 죽는다.
# ---------------------------------------------------------------------------
JWT_SECRET: replace-this-with-a-random-secret-at-least-32-bytes
JWT_EXPIRATION_MS: 86400000
