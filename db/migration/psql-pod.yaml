# Main RDS 에 손으로 SQL 을 돌리기 위한 임시 파드.
#
# 왜 이 파일이 필요한가 — Main RDS 는 Private DB Subnet 에 있어 클러스터 밖에서
# 직접 붙지 못한다. 그리고 gamehouse 네임스페이스에는 두 가지 제약이 있다.
#
#   1) NetworkPolicy 가 default-deny 다. 아무 라벨 없는 파드는 RDS 로 나가지 못한다.
#      -> metadata.labels 의 app.kubernetes.io/name: crew 가 crew 의 egress 규칙
#         (RDS 5432 · DNS) 을 그대로 물려받게 해 준다. 이 라벨을 빼면 연결이 조용히
#         타임아웃된다.
#
#   2) PodSecurity 가 restricted 다. securityContext 를 명시하지 않으면
#      "violates PodSecurity restricted:latest" 로 생성 자체가 거부된다.
#      -> runAsNonRoot / allowPrivilegeEscalation:false / capabilities drop ALL /
#         seccompProfile 네 가지가 모두 있어야 한다.
#
# 접속 정보는 crew 가 쓰는 Secret 을 그대로 읽는다. 비밀번호가 이 파일에 남지 않는다.
#
# 사용법과 주의사항은 같은 폴더의 README.md 참고.
# 다 쓰면 반드시 지운다: kubectl delete pod psql-seed -n gamehouse
apiVersion: v1
kind: Pod
metadata:
  name: psql-seed
  namespace: gamehouse
  labels:
    app.kubernetes.io/name: crew
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 999          # postgres 이미지의 postgres 계정
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: psql
      image: postgres:16
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 999
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: PGHOST
          valueFrom:
            secretKeyRef: { name: crew-db-credentials, key: DB_HOST }
        - name: PGUSER
          valueFrom:
            secretKeyRef: { name: crew-db-credentials, key: DB_USERNAME }
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: crew-db-credentials, key: DB_PASSWORD }
        - name: PGDATABASE
          value: duo
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "200m", memory: "128Mi" }
